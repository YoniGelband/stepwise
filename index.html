<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<title>First Slides to Carving</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%232f80c9%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column, phone first. The map is a downhill run drawn in SVG; a level opens as its own screen. */
:root {
  --snow: #f3f7fb;          /* page ground */
  --card: #ffffff;
  --ink: #0f2a44;           /* night-sky navy: text */
  --muted: #56708a;
  --line: #d3dfea;
  --ice: #2f80c9;           /* accent: glacier blue */
  --ice-ink: #ffffff;
  --piste-green: #2e9d5b;
  --piste-blue: #2f6fd1;
  --piste-red: #d23a3a;
  --piste-black: #10161d;
  --locked: #b8c6d4;
  --track: #9fb4c8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --snow: #0b1a2a; --card: #12263b; --ink: #e8f0f8; --muted: #93a9bf; --line: #24405c;
    --ice: #5aa9ef; --ice-ink: #06121f; --piste-black: #e8f0f8; --locked: #33506c; --track: #3d5b78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --snow: #0b1a2a; --card: #12263b; --ink: #e8f0f8; --muted: #93a9bf; --line: #24405c;
  --ice: #5aa9ef; --ice-ink: #06121f; --piste-black: #e8f0f8; --locked: #33506c; --track: #3d5b78;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--snow); color: var(--ink);
  font: 17px/1.5 var(--body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
.muted { color: var(--muted); }

/* ---- Map ---------------------------------------------------------------- */
.top { padding-block: 20px 8px; display: grid; gap: 6px; }
.eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.top h1 { font-size: 2rem; font-weight: 800; }
.meter { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.meter .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter .fill { height: 100%; background: var(--ice); border-radius: 99px; transition: width 0.6s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.85rem; color: var(--muted); padding-block: 4px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.diamond { border-radius: 2px; transform: rotate(45deg) scale(0.85); }

.map { width: 100%; height: auto; display: block; margin-block: 4px 8px; overflow: visible; }
.map .trail { fill: none; stroke: var(--track); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; }
.map .trail-done { fill: none; stroke: var(--ice); stroke-width: 4; stroke-linecap: round; }
.map .tree { fill: var(--track); opacity: 0.55; }
.map .node { cursor: pointer; }
.map .node.locked { cursor: default; }
.map .node circle.base { stroke: var(--snow); stroke-width: 4; }
.map .node.locked .base { fill: var(--locked); }
.map .node text.num { font: 700 15px var(--body); fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map .node.black:not(.locked) text.num { fill: var(--snow); }
.map .node .ring { fill: none; stroke: var(--ice); stroke-width: 3; opacity: 0; }
.map .node.current .ring { opacity: 1; animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.map .label { font: 700 13px var(--body); fill: var(--ink); pointer-events: none; }
.map .label.locked { fill: var(--muted); font-weight: 400; }
.map .sign { font: 800 11px var(--display); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
.map .rider { transition: transform 1.1s cubic-bezier(.5,.05,.3,1); }
.map .rider .board { fill: var(--ice); }
.map .rider .body { stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; fill: none; }
.map .rider .head { fill: var(--ink); }
@keyframes pulse { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.7); opacity: 0; } }

.foot { padding-block: 8px 32px; font-size: 0.85rem; color: var(--muted); display: grid; gap: 10px; }
.foot a { color: var(--ice); }
.linkish { background: none; border: 0; padding: 0; color: var(--ice); text-decoration: underline; cursor: pointer; font-size: inherit; justify-self: start; }

/* ---- Level -------------------------------------------------------------- */
/* --tone is the level's piste colour; buttons and the counter ring take it. */
.level { padding-block: 8px 120px; display: grid; gap: 18px; }
.level.green { --tone: var(--piste-green); --tone-ink: #fff; }
.level.blue  { --tone: var(--piste-blue);  --tone-ink: #fff; }
.level.red   { --tone: var(--piste-red);   --tone-ink: #fff; }
.level.black { --tone: var(--piste-black); --tone-ink: var(--snow); }

.bar-top { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; flex: none; box-shadow: 0 1px 3px rgb(15 42 68 / 0.12); }
.round svg { width: 22px; height: 22px; }
.bar-top { display: grid; grid-template-columns: 44px 1fr 44px; }
.where { justify-self: center; display: inline-flex; align-items: center; gap: 8px; font-weight: 700;
  font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
/* The level badge: the same piste marker as on the map, with the level number inside. */
.badge { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: var(--tone); color: var(--tone-ink); font: 800 0.85rem var(--body); }
.level.black .badge { border-radius: 4px; transform: rotate(45deg) scale(0.86); }
.level.black .badge span { transform: rotate(-45deg); }
.level-title { font-size: 1.75rem; font-weight: 800; padding-top: 4px; }
.level-title.quiet { font-size: 1.05rem; font-weight: 700; color: var(--muted); font-family: var(--body); text-align: center; }

/* The video runs edge to edge on a phone; on a wide screen it sits in the column with rounded corners. */
.video { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
@media (min-width: 600px) { .video { margin-inline: 0; border-radius: 16px; } }
.video .yt, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video .shield { position: absolute; inset: 0; cursor: pointer; }
.video .bigplay { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px;
  border-radius: 50%; background: rgb(0 0 0 / 0.45); display: grid; place-items: center; pointer-events: none;
  transition: opacity 0.2s; }
.video .bigplay svg { width: 30px; height: 30px; fill: #fff; margin-left: 4px; }
.video.playing .bigplay { opacity: 0; }
/* The cover hides YouTube's own screens: the poster until the clip first plays, then a
   dark veil while paused (YouTube shows its title and "More videos" then). Loading
   ("buffering") is not paused, so the veil stays off. The end screen (.end) is solid black. */
.video .cover { position: absolute; inset: 0; background: #000 center / cover no-repeat; pointer-events: none; transition: opacity 0.25s; }
.video .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / 0.55), rgb(0 0 0 / 0.1) 60%); }
.video.started .cover { background-image: none !important; background-color: rgb(0 0 0 / 0.82); }
.video.started .cover::after { display: none; }
.video.playing .cover, .video.started:not(.paused) .cover { opacity: 0; }
/* Full screen: the real API where the phone has it; on iPhone, which only lets a bare
   <video> go full screen, the player is stretched over the whole page instead. */
.video:fullscreen { margin: 0; border-radius: 0; width: 100%; height: 100%; aspect-ratio: auto; }
.video.full { position: fixed; inset: 0; z-index: 50; margin: 0; border-radius: 0; aspect-ratio: auto; }
/* Keep our controls clear of the notch and the home bar. */
.video.full .pills { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); }
.video.full .clock { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); }
.video.full .line { bottom: env(safe-area-inset-bottom, 0px); }
.video.full input.scrub { bottom: calc(-10px + env(safe-area-inset-bottom, 0px)); }
body.lock { overflow: hidden; }
.video .pills { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.pill-sm { min-width: 44px; height: 32px; padding: 0 10px; border-radius: 99px; border: 0; cursor: pointer;
  background: rgb(0 0 0 / 0.5); color: #fff; font: 700 0.85rem var(--body); }
.pill-sm[aria-pressed="true"] { background: #fff; color: #000; }
.video .clock { position: absolute; left: 12px; bottom: 12px; font: 700 0.8rem var(--body); color: #fff;
  font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgb(0 0 0 / 0.6); pointer-events: none; }
.video .line { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgb(255 255 255 / 0.3); pointer-events: none; }
.video .line i { display: block; height: 100%; width: 0; background: var(--tone); }
.level.black .video .line i { background: #fff; }
.video input.scrub { position: absolute; left: 0; right: 0; bottom: -10px; width: 100%; height: 28px; margin: 0; opacity: 0; cursor: pointer; }
.video .end { position: absolute; inset: 0; background: #000; display: grid; place-content: center;
  gap: 12px; padding: 16px; text-align: center; color: #fff; }
.video .end p { margin: 0; font: 800 1.2rem var(--display); }
.video .end .pills-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.pill { min-height: 52px; padding: 0 24px; border-radius: 99px; border: 0; cursor: pointer;
  font: 700 1.05rem var(--body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.pill.go { background: var(--tone); color: var(--tone-ink); }
.pill.ghost { background: rgb(255 255 255 / 0.16); color: #fff; box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.7); }
.pill.wide { width: 100%; }
.pill:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.skip { justify-self: center; background: none; border: 0; color: var(--muted); font: 700 0.95rem var(--body);
  min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.credit { margin: -8px 0 0; font-size: 0.8rem; color: var(--muted); }

/* Tasks: one goal line per task, a big round counter to tap, the how-to folded away. */
.goals { display: grid; gap: 28px; padding-top: 12px; }
.goal { display: grid; gap: 14px; justify-items: center; text-align: center; }
.goal + .goal { border-top: 1px solid var(--line); padding-top: 28px; }
.goal h3 { font-size: 1.35rem; font-weight: 800; max-width: 22ch; }
.goal details { justify-self: stretch; color: var(--muted); }
.goal summary { cursor: pointer; font-weight: 700; color: var(--ink); min-height: 44px; display: flex; align-items: center; justify-content: center; }
.goal details p { text-align: left; max-width: 60ch; margin-inline: auto; }
.goal details p { margin: 6px 0 0; }
.goal summary { list-style: none; gap: 6px; }
.goal summary::-webkit-details-marker { display: none; }
.goal summary::after { content: "+"; font-size: 1.2rem; color: var(--muted); }
.goal details[open] summary::after { content: "–"; }
.counter { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: none; color: var(--ink); touch-action: manipulation; }
.counter svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.counter .track { fill: none; stroke: var(--line); stroke-width: 8; }
.counter .fill { fill: none; stroke: var(--tone); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.25s ease; }
.counter .n { position: relative; font: 800 2.4rem var(--display); font-variant-numeric: tabular-nums; }
.counter .of { position: relative; display: block; font: 700 0.75rem var(--body); color: var(--muted); }
.counter.full { background: var(--tone); color: var(--tone-ink); }
.counter.full .of { color: var(--tone-ink); }
.counter:active { transform: scale(0.96); }
.undo { margin-top: -6px; background: none; border: 0; color: var(--muted);
  font: 700 0.85rem var(--body); min-height: 32px; cursor: pointer; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--snow) 70%, transparent); }
.dock .pill { max-width: 528px; margin: 0 auto; display: flex; }
.small-btn { min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; }
.finale { text-align: center; padding: 24px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px; }
.confirm { display: grid; gap: 10px; padding: 14px; border-radius: 12px; border: 1px solid var(--piste-red); background: var(--card); }
.confirm .row { display: flex; gap: 10px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  .map .rider, .meter .fill { transition: none; }
  .map .node.current .ring { animation: none; }
}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="muted" style="padding-top:24px">Loading the course…</p></main>

<script>
// ---------------------------------------------------------------------------
// The masterclass page. Three parts:
//   1. Course data and saved progress (which levels are done, which tasks ticked).
//   2. The map: a downhill run with one stop per level and the rider on the current one.
//   3. The level screen: the clip edge to edge, then "Watch again" or "Let's ride", then a
//      big counter per task and "Complete level".
// The address bar holds the open screen (#level-5), so the phone's back button works.
// ---------------------------------------------------------------------------

// Levels are grouped into stages, coloured like piste markers: green is easiest, black hardest.
const STAGES = [
  { name: "First slides",       from: 1,  to: 2,  colour: "green" },
  { name: "Side slips",         from: 3,  to: 6,  colour: "green" },
  { name: "First turns",        from: 7,  to: 9,  colour: "blue"  },
  { name: "Posture and gate",   from: 10, to: 11, colour: "red"   },
  { name: "Carving",            from: 12, to: 17, colour: "black" },
];
const stageOf = (n) => STAGES.find((s) => n >= s.from && n <= s.to) || STAGES[STAGES.length - 1];

let course = null;

// ---- 1. Progress ----------------------------------------------------------
// Kept on this phone only. Storage can be blocked (private windows), so every read and
// write is guarded and the page still works for this visit without it.
const STORE = "mm-carving-progress-v1";
let progress = { done: [], ticks: {} };   // done: level numbers; ticks: { "5": [true, false] }

function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && Array.isArray(saved.done)) progress = { done: saved.done, ticks: saved.ticks || {} };
  } catch (e) { /* start fresh */ }
}
function saveProgress() {
  try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) { /* not saved */ }
}
const isDone = (n) => progress.done.includes(n);
const isOpen = (n) => n === 1 || isDone(n - 1) || isDone(n);
function currentLevel() {               // the first level not yet done
  for (let n = 1; n <= course.levels.length; n++) if (!isDone(n)) return n;
  return null;                           // all done
}

// ---- Helpers ---------------------------------------------------------------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function clock(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
}
const app = document.getElementById("app");

// ---- 2. Map ------------------------------------------------------------------
// The run is drawn on a fixed 360-unit-wide canvas that scales to the screen. Each level
// sits lower than the last and swings left and right, like turns down a slope.
const W = 360, GAP = 96, TOP = 70;
function nodePoint(i) {                 // i is 0-based
  return { x: W / 2 + Math.sin(i * 1.15) * 105, y: TOP + i * GAP };
}
function trailPath(points) {            // smooth curve through the points
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i], mid = (a.y + b.y) / 2;
    d += ` C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.y}`;
  }
  return d;
}
function trees(height) {                // a few pines down the edges, always in the same places
  let out = "";
  for (let y = 40; y < height - 20; y += 58) {
    const left = (y * 7) % 23, right = (y * 11) % 19;
    out += `<path class="tree" d="M ${8 + left} ${y} l 9 18 h -18 z M ${8 + left} ${y + 8} l 11 20 h -22 z"/>`;
    out += `<path class="tree" d="M ${W - 10 - right} ${y + 26} l 9 18 h -18 z M ${W - 10 - right} ${y + 34} l 11 20 h -22 z"/>`;
  }
  return out;
}
const RIDER = `<g class="rider-art" transform="translate(-16,-48)">
  <rect class="board" x="0" y="30" width="34" height="7" rx="3.5" transform="rotate(-12 17 33)"/>
  <path class="body" d="M10 30 L14 20 L20 20 L24 30 M14 20 L17 10 M17 10 L8 15 M17 10 L28 8"/>
  <circle class="head" cx="18" cy="5" r="4.5"/></g>`;

function renderMap(arriveFrom) {
  const levels = course.levels, count = levels.length;
  const points = levels.map((_, i) => nodePoint(i));
  const height = TOP + (count - 1) * GAP + 70;
  const current = currentLevel();
  const doneCount = progress.done.length;
  const lastDone = current ? current - 1 : count;    // the trail is solid up to here

  const nodes = levels.map((level, i) => {
    const n = i + 1, p = points[i], stage = stageOf(n);
    const state = isDone(n) ? "done" : n === current ? "current" : isOpen(n) ? "open" : "locked";
    const right = p.x <= W / 2;                       // label on the roomier side
    const lx = right ? p.x + 30 : p.x - 30;
    const sign = stage.from === n
      ? `<text class="sign" x="${right ? p.x + 30 : p.x - 30}" y="${p.y - 30}" text-anchor="${right ? "start" : "end"}">${esc(stage.name)}</text>` : "";
    const shape = stage.colour === "black"
      ? `<rect class="base" x="${p.x - 17}" y="${p.y - 17}" width="34" height="34" rx="4" transform="rotate(45 ${p.x} ${p.y})" fill="var(--piste-black)"/>`
      : `<circle class="base" cx="${p.x}" cy="${p.y}" r="21" fill="var(--piste-${stage.colour})"/>`;
    const mark = state === "done" ? "✓" : n;
    return `${sign}<g class="node ${state} ${stage.colour}" data-level="${n}" ${state === "locked" ? "" : 'role="button" tabindex="0"'}
              aria-label="Level ${n}: ${esc(level.title)}${state === "done" ? ", done" : state === "locked" ? ", locked" : ""}">
        <circle class="ring" cx="${p.x}" cy="${p.y}" r="22"/>${shape}
        <text class="num" x="${p.x}" y="${p.y}">${mark}</text>
        <text class="label ${state === "locked" ? "locked" : ""}" x="${lx}" y="${p.y + 5}" text-anchor="${right ? "start" : "end"}">${esc(shortTitle(level.title))}</text>
      </g>`;
  }).join("");

  const riderAt = current ? points[current - 1] : points[count - 1];
  const riderFrom = arriveFrom ? points[arriveFrom - 1] : riderAt;
  const donePath = lastDone >= 1 ? trailPath(points.slice(0, Math.min(lastDone + 1, count))) : "";

  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Snowboard masterclass · ${esc(course.teacher)}</div>
      <h1>First slides to carving</h1>
      <div class="meter" aria-label="${doneCount} of ${count} levels done">
        <div class="bar"><div class="fill" style="width:${(doneCount / count) * 100}%"></div></div>
        <span>${doneCount}/${count}</span>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--piste-green)"></i>Beginner</span>
        <span><i class="dot" style="background:var(--piste-blue)"></i>Turning</span>
        <span><i class="dot" style="background:var(--piste-red)"></i>Gate</span>
        <span><i class="dot diamond" style="background:var(--piste-black)"></i>Carving</span>
      </div>
    </header>
    <svg class="map" viewBox="0 0 ${W} ${height}" role="group" aria-label="The run, level by level">
      ${trees(height)}
      <path class="trail" d="${trailPath(points)}"/>
      ${donePath ? `<path class="trail-done" d="${donePath}"/>` : ""}
      ${nodes}
      <g class="rider" style="transform: translate(${riderFrom.x}px, ${riderFrom.y - 20}px)">${RIDER}</g>
    </svg>
    <footer class="foot">
      ${current ? "" : `<div class="finale"><h2>You can carve.</h2><p class="muted">Every level is done. Go and leave some pencil lines.</p></div>`}
      <p>An unofficial course put together from
        <a href="https://www.youtube.com/@MalcolmMoore" target="_blank" rel="noopener">Malcolm Moore's</a> free YouTube videos.
        All instruction and video is his.</p>
      <button class="linkish" id="reset">Start the course again</button>
      <div id="reset-confirm"></div>
    </footer>`;

  // Move the rider from the level just finished to the new current one.
  if (arriveFrom && riderFrom !== riderAt) {
    const rider = app.querySelector(".rider");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      rider.style.transform = `translate(${riderAt.x}px, ${riderAt.y - 20}px)`;
    }));
  }

  app.querySelectorAll(".node[role=button]").forEach((node) => {
    const open = () => { location.hash = "level-" + node.dataset.level; };
    node.addEventListener("click", open);
    node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  document.getElementById("reset").addEventListener("click", showResetConfirm);

  // Bring the current level into view (the run is longer than a phone screen).
  if (current && current > 3) {
    const node = app.querySelector(`.node[data-level="${current}"]`);
    if (node) setTimeout(() => node.scrollIntoView({ block: "center", behavior: arriveFrom ? "smooth" : "auto" }), arriveFrom ? 50 : 0);
  }
}

function shortTitle(title) {            // keep map labels to one short line
  const t = title.replace(/^Posture: the ski pole drill$/, "Ski pole posture drill").replace(/, front foot strapped in$/, "").replace(/, both edges$/, "").replace(/^Diagonal side slip, ([a-z]+) side$/, "Diagonal slip, $1");
  return t.length > 24 ? t.slice(0, 23) + "…" : t;
}

function showResetConfirm() {
  document.getElementById("reset-confirm").innerHTML = `
    <div class="confirm"><p>Clear every tick and start again from level 1?</p>
      <div class="row"><button class="small-btn" id="reset-yes">Yes, start again</button>
      <button class="small-btn" id="reset-no">Keep my progress</button></div></div>`;
  document.getElementById("reset-yes").onclick = () => { progress = { done: [], ticks: {} }; saveProgress(); window.scrollTo(0, 0); renderMap(); };
  document.getElementById("reset-no").onclick = () => { document.getElementById("reset-confirm").innerHTML = ""; };
}

// ---- 3. Level screen -----------------------------------------------------------
// Two views of one level: "watch" (the clip, edge to edge) and "ride" (the tasks).
let player = null;           // the one YouTube player on screen
let playerTimer = null;

const ICON = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  play: `<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>`,
};

// Two rows: a slim bar (back, level badge) and the title on its own line. On the task
// page the title is quiet, so the goals are the biggest thing on screen.
function levelShell(n, body, quiet) {
  const level = course.levels[n - 1], stage = stageOf(n);
  return `
    <section class="level ${stage.colour}">
      <div class="bar-top">
        <button class="round" id="back" aria-label="Back to the run">${ICON.back}</button>
        <div class="where"><span class="badge"><span>${n}</span></span>Level ${n} of ${course.levels.length}</div>
      </div>
      <h2 class="level-title ${quiet ? "quiet" : ""}">${esc(level.title)}${quiet ? " · tasks" : ""}</h2>
      ${body}
    </section>`;
}

function renderLevel(n) {
  const level = course.levels[n - 1];
  if (!level || !isOpen(n)) { location.hash = ""; return; }
  const v = level.video;
  if (!v) { showTasks(n); return; }
  app.innerHTML = levelShell(n, `
    <div class="video" id="video">
      <div class="yt" id="yt"></div>
      <div class="cover" style="background-image:url('https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg')"></div>
      <div class="shield" id="shield"></div>
      <div class="bigplay">${ICON.play}</div>
      <div class="pills">
        <button class="pill-sm" id="cc" aria-pressed="false" aria-label="Captions">CC</button>
        <button class="pill-sm" id="speed" aria-label="Playback speed">1×</button>
        <button class="pill-sm" id="fs" aria-label="Full screen">⤢</button>
      </div>
      <span class="clock" id="clock">0:00 / ${clock(v.end - v.start)}</span>
      <div class="line"><i id="line"></i></div>
      <input class="scrub" id="scrub" type="range" min="0" max="${v.end - v.start}" value="0" step="1" aria-label="Position in clip">
      <div class="end" id="end" hidden>
        <p>Got it?</p>
        <div class="pills-row">
          <button class="pill ghost" id="again">Watch again</button>
          <button class="pill go" id="ride">Let's ride</button>
        </div>
      </div>
    </div>
    <p class="credit">Malcolm Moore · ${esc(v.title)}</p>
    <button class="skip" id="skip">Skip to the tasks</button>`);
  window.scrollTo(0, 0);
  document.getElementById("back").onclick = () => { location.hash = ""; };
  document.getElementById("skip").onclick = () => showTasks(n);
  document.getElementById("ride").onclick = () => showTasks(n);
  document.getElementById("again").onclick = () => {
    if (!player || !player.ready) return;
    player.finished = false; document.getElementById("end").hidden = true;
    player.yt.seekTo(v.start, true); player.yt.playVideo();
  };
  setUpPlayer(v);
}

// Saved counts for a level's tasks. Older saves held true/false ticks: true counts as done.
function countsFor(n) {
  const tasks = course.levels[n - 1].tasks, saved = progress.ticks[n] || [];
  return tasks.map((t, i) => saved[i] === true ? t.count : Math.min(Number(saved[i]) || 0, t.count));
}

function ring(done, total) {            // the counter's circle, filled by how far along you are
  const r = 42, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 96 96" aria-hidden="true"><circle class="track" cx="48" cy="48" r="${r}"/>
    <circle class="fill" cx="48" cy="48" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - done / total)}"/></svg>`;
}

function showTasks(n) {
  const level = course.levels[n - 1];
  stopPlayer();
  const counts = countsFor(n);
  const goalHtml = (t, i) => {
    const full = counts[i] >= t.count;
    return `
      <div class="goal" data-i="${i}">
        <h3>${esc(t.pass)}</h3>
        <button class="counter ${full ? "full" : ""}" data-i="${i}"
          aria-label="${t.count > 1 ? `Count one more: ${counts[i]} of ${t.count}` : full ? "Done, tap to undo" : "Tap when done"}">
          ${ring(counts[i], t.count)}
          <span><span class="n">${t.count > 1 ? counts[i] : full ? "✓" : "Tap"}</span>
          ${t.count > 1 ? `<span class="of">of ${t.count}</span>` : ""}</span>
        </button>
        ${t.count > 1 && counts[i] > 0 ? `<button class="undo" data-i="${i}">Undo</button>` : ""}
        <details><summary>How to do it</summary><p>${esc(t.text)}</p></details>
      </div>`;
  };
  const allDone = () => counts.every((c, i) => c >= level.tasks[i].count);

  app.innerHTML = levelShell(n, `
    <div class="goals" id="goals">${level.tasks.map(goalHtml).join("")}</div>
    ${level.video ? `<button class="skip" id="rewatch">Watch the video again</button>` : ""}
    <div class="dock"><button class="pill go wide" id="complete"></button></div>`, true);
  window.scrollTo(0, 0);
  document.getElementById("back").onclick = () => { location.hash = ""; };
  const rewatch = document.getElementById("rewatch");
  if (rewatch) rewatch.onclick = () => renderLevel(n);

  const complete = document.getElementById("complete");
  const refreshDock = () => {
    if (isDone(n)) { complete.textContent = "Back to the run"; complete.disabled = false; }
    else { complete.textContent = allDone() ? "Complete level" : "Finish every task to move on"; complete.disabled = !allDone(); }
  };
  refreshDock();
  complete.onclick = () => {
    if (!isDone(n)) { progress.done.push(n); saveProgress(); arriving = n; }
    location.hash = "";
  };

  // Tapping the counter adds one; on a single-tick task it switches done and not done.
  const goals = document.getElementById("goals");
  goals.addEventListener("click", (e) => {
    const btn = e.target.closest(".counter, .undo");
    if (!btn) return;
    const i = Number(btn.dataset.i), target = level.tasks[i].count;
    if (btn.classList.contains("undo")) counts[i] = Math.max(0, counts[i] - 1);
    else if (target === 1) counts[i] = counts[i] ? 0 : 1;
    else if (counts[i] < target) counts[i] += 1;
    else return;
    try { navigator.vibrate && navigator.vibrate(15); } catch (err) {}
    progress.ticks[n] = counts.slice(); saveProgress();
    const box = goals.querySelector(`.goal[data-i="${i}"]`);
    box.outerHTML = goalHtml(level.tasks[i], i);
    refreshDock();
  });
}

// ---- The locked player ------------------------------------------------------------
// YouTube's own controls are off and a clear "shield" covers the video, so playback stays
// inside the clip: tapping plays or pauses, a double tap goes full screen, and the thin
// line only reaches across the clip.
let apiReady = null;
function loadYouTube() {
  if (!apiReady) apiReady = new Promise((resolve) => {
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  });
  return apiReady;
}
function loadSetting(name, fallback) { try { return localStorage.getItem(name) ?? fallback; } catch (e) { return fallback; } }
function saveSetting(name, value) { try { localStorage.setItem(name, value); } catch (e) {} }
const SPEEDS = ["1", "1.25", "0.75"];   // tapping the speed pill cycles through these

async function setUpPlayer(v) {
  await loadYouTube();
  if (!document.getElementById("yt")) return;          // left the screen while loading
  const state = { yt: null, ready: false, finished: false, dragging: false, captions: loadSetting("mm-captions", "off") === "on" };
  player = state;
  const box = document.getElementById("video"), line = document.getElementById("line"), clockEl = document.getElementById("clock");
  const scrub = document.getElementById("scrub"), end = document.getElementById("end");
  const cc = document.getElementById("cc"), speedBtn = document.getElementById("speed");
  let speed = loadSetting("mm-speed", "1");
  if (!SPEEDS.includes(speed)) speed = "1";
  speedBtn.textContent = speed + "×";
  cc.setAttribute("aria-pressed", state.captions);
  const setCaptions = (on) => {
    if (on) { state.yt.loadModule("captions"); state.yt.setOption("captions", "track", { languageCode: "en" }); }
    else state.yt.unloadModule("captions");
  };

  state.yt = new YT.Player("yt", {
    videoId: v.id, width: "100%", height: "100%",
    playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3,
                  start: v.start, end: v.end, origin: location.origin, cc_load_policy: state.captions ? 1 : 0, cc_lang_pref: "en" },
    events: {
      onReady: () => { state.ready = true; state.yt.setPlaybackRate(Number(speed)); },
      onError: (e) => { state.failed = true; clockEl.textContent = "This video can't play here (error " + e.data + ")."; },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          box.classList.add("started");
          if (!state.captionsSet) { state.captionsSet = true; setCaptions(state.captions); }
        }
      },
    },
  });

  const togglePlay = () => {
    if (!state.ready || player !== state) return;      // the player may be gone after leaving the screen
    if (state.yt.getPlayerState() === YT.PlayerState.PLAYING) state.yt.pauseVideo(); else state.yt.playVideo();
  };
  // A single tap waits a moment in case a second tap follows (a double tap means full screen).
  // The very first tap plays at once: phones only allow starting a video straight from a tap.
  let tapTimer = null;
  document.getElementById("shield").onclick = () => {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; toggleFull(box); return; }
    if (!box.classList.contains("started")) { togglePlay(); tapTimer = setTimeout(() => { tapTimer = null; }, 300); return; }
    tapTimer = setTimeout(() => { tapTimer = null; togglePlay(); }, 300);
  };
  document.getElementById("fs").onclick = () => toggleFull(box);
  cc.onclick = () => {
    state.captions = !state.captions;
    cc.setAttribute("aria-pressed", state.captions);
    saveSetting("mm-captions", state.captions ? "on" : "off");
    if (state.ready) setCaptions(state.captions);
  };
  speedBtn.onclick = () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    speedBtn.textContent = speed + "×"; saveSetting("mm-speed", speed);
    if (state.ready) state.yt.setPlaybackRate(Number(speed));
  };
  scrub.oninput = () => { state.dragging = true; line.style.width = (scrub.value / (v.end - v.start)) * 100 + "%"; };
  scrub.onchange = () => {
    state.dragging = false;
    if (state.ready) { state.finished = false; end.hidden = true; state.yt.seekTo(v.start + Number(scrub.value), true); }
  };

  // Four times a second: keep playback inside the clip and refresh the line and clock.
  playerTimer = setInterval(() => {
    if (!state.ready || state.failed) return;
    const pos = state.yt.getCurrentTime(), playing = state.yt.getPlayerState() === YT.PlayerState.PLAYING;
    if (playing && pos < v.start - 1) state.yt.seekTo(v.start, true);
    if (pos >= v.end - 0.3 && !state.finished) { state.yt.pauseVideo(); state.finished = true; end.hidden = false; }
    box.classList.toggle("playing", playing);
    const ps = state.yt.getPlayerState();
    box.classList.toggle("paused", ps === YT.PlayerState.PAUSED || ps === YT.PlayerState.CUED);
    const into = state.finished ? v.end - v.start : Math.min(Math.max(pos - v.start, 0), v.end - v.start);
    if (!state.dragging) { scrub.value = into; line.style.width = (into / (v.end - v.start)) * 100 + "%"; }
    clockEl.textContent = clock(into) + " / " + clock(v.end - v.start);
  }, 250);
}

function toggleFull(box) {
  const real = document.fullscreenElement || document.webkitFullscreenElement;
  if (real) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (box.classList.contains("full")) { box.classList.remove("full"); document.body.classList.remove("lock"); return; }
  const ask = box.requestFullscreen || box.webkitRequestFullscreen;
  const fallback = () => { box.classList.add("full"); document.body.classList.add("lock"); };
  if (!ask) { fallback(); return; }
  new Promise((resolve) => resolve(ask.call(box))).then(() => {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) { fallback(); return; }
    try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {}
  }).catch(fallback);
}

function stopPlayer() {
  document.body.classList.remove("lock");
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
  clearInterval(playerTimer); playerTimer = null;
  if (player && player.yt && player.yt.destroy) { try { player.yt.destroy(); } catch (e) {} }
  player = null;
}

// ---- Routing -----------------------------------------------------------------------
let arriving = null;
function route() {
  stopPlayer();
  const m = location.hash.match(/^#level-(\d+)$/);
  if (m) renderLevel(Number(m[1]));
  else { const from = arriving; arriving = null; renderMap(from); }
}

(async function start() {
  loadProgress();
  try {
    course = await (await fetch("course.json")).json();
  } catch (e) {
    app.innerHTML = `<p style="padding-top:24px">The course could not be loaded. Check your connection and reload.</p>`;
    return;
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
